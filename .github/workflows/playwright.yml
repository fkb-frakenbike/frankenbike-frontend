name: Playwright Tests
# The e2e tests need the front AND a seeded API, which CI does not start yet.
# Manual run only until a CI job provides both (see tests/e2e/e2e.config.ts).
on:
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04  # ubuntu-latest is 26.04, unsupported by Playwright 1.56
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
